      This is a placeholder for base href that will be replaced by the value of

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Midsphere Studio, the client for the Sukuna agent.">
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
    <script src="https://accounts.google.com/gsi/client" async defer></script>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: hsl(0, 0%, 3.9%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .grid-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(hsl(0, 0%, 14.9%) 1px, transparent 1px),
                linear-gradient(90deg, hsl(0, 0%, 14.9%) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.5;
            mask-image: radial-gradient(ellipse 80% 50% at 50% 50%, black 40%, transparent 100%);
        }

        .loading-container {
            text-align: center;
            position: relative;
            z-index: 1;
            transition: opacity 0.3s ease-out;
        }

        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 2px solid hsl(0, 0%, 14.9%);
            border-top-color: hsl(0, 0%, 98%);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            font-size: 0.875rem;
            color: hsl(0, 0%, 63.9%);
            font-weight: 400;
        }
    </style>


    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Midsphere Studio">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/png" href="favicon.png"/>

<body>
<div class="loading-container" id="loading">
    <div class="spinner"></div>
</div>
<script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
        const loading = document.getElementById('loading');
        if (loading) {
            loading.classList.add('hidden');
            // Remove from DOM after animation completes
            setTimeout(function() {
                loading.remove();
            }, 300);
        }
    });
</script>
